<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="MiFix LLC home">
          <span class="brand-mark">M</span>
          <span>MiFix<span class="brand-dot">.</span>LLC</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#latest">Notes</a>
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a class="nav-contact" href="mailto:{{ site.author.email }}">Get in touch <span aria-hidden="true">↗</span></a>
        </nav>
      </header>

      <main>{{ content }}</main>

      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} MiFix LLC</span>
        <span>Build thoughtfully. Ship clearly.</span>
      </footer>
    </div>
  </body>
</html>
